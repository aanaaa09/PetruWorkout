# .github/workflows/ci.yml
# Se ejecuta automáticamente en GitHub
# Bloquea commit/merge si tests fallan

name: CI/CD - Tests y Deploy

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: Tests Backend
  # ==========================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    # PostgreSQL temporal en GitHub (GRATIS)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: 🧪 Ejecutar tests unitarios
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          EMAIL_API: test_key
          CALENDLY_API_KEY: test_key
          CALENDLY_USER_URI: test_uri
          CALENDLY_EVENT_URL: test_url
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          SPOTIFY_REFRESH_TOKEN: test_token
          OPENAI_API_KEY: test_key
        run: |
          cd backend
          pytest tests/unit/ -v --cov=backend --cov-report=term-missing

  # ==========================================
  # JOB 2: Tests de Integración
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: 🚀 Iniciar servidor backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          EMAIL_API: test_key
          CALENDLY_API_KEY: test_key
          CALENDLY_USER_URI: test_uri
          CALENDLY_EVENT_URL: test_url
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          SPOTIFY_REFRESH_TOKEN: test_token
          OPENAI_API_KEY: test_key
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 5000 &
          sleep 10

      - name: 🧪 Ejecutar tests de integración
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          EMAIL_API: test_key
          CALENDLY_API_KEY: test_key
          CALENDLY_USER_URI: test_uri
          CALENDLY_EVENT_URL: test_url
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          SPOTIFY_REFRESH_TOKEN: test_token
          OPENAI_API_KEY: test_key
        run: |
          cd backend
          pytest tests/integration/ -v

  # ==========================================
  # JOB 3: Tests E2E (Selenium)
  # ==========================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 🌐 Instalar Chrome
        uses: browser-actions/setup-chrome@latest

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install selenium pytest pytest-selenium webdriver-manager httpx
          cd frontend
          npm ci
          npm run build

      - name: 🚀 Iniciar backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          EMAIL_API: test_key
          CALENDLY_API_KEY: test_key
          CALENDLY_USER_URI: test_uri
          CALENDLY_EVENT_URL: test_url
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          SPOTIFY_REFRESH_TOKEN: test_token
          OPENAI_API_KEY: test_key
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 5000 &
          sleep 10

      - name: 🚀 Iniciar frontend
        run: |
          cd frontend
          npm run preview -- --host 0.0.0.0 --port 5173 &
          sleep 10

      - name: 🧪 Ejecutar tests E2E
        env:
          CI: true
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          EMAIL_API: test_key
          CALENDLY_API_KEY: test_key
          CALENDLY_USER_URI: test_uri
          CALENDLY_EVENT_URL: test_url
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          SPOTIFY_REFRESH_TOKEN: test_token
          OPENAI_API_KEY: test_key
        run: |
          cd backend
          pytest tests/e2e/ -v

      - name: 📸 Guardar screenshots si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: backend/tests/e2e/screenshots/
          retention-days: 7

  # ==========================================
  # JOB 4: Deploy a Railway (solo main)
  # ==========================================
  deploy:
    name: Deploy a Railway
    runs-on: ubuntu-latest
    needs: [backend-tests, integration-tests, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🚀 Deploy a Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_NAME }}

      - name: ✅ Deploy exitoso
        run: |
          echo "✅ Desplegado exitosamente a Railway"
          echo "🌐 URL: https://petrucalistenia.com"

  # ==========================================
  # JOB 5: Notificación final
  # ==========================================
  notify-status:
    name: Estado Final
    runs-on: ubuntu-latest
    needs: [backend-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: ✅ Tests pasaron
        if: |
          needs.backend-tests.result == 'success' && 
          needs.integration-tests.result == 'success' && 
          needs.e2e-tests.result == 'success'
        run: |
          echo "✅ TODOS LOS TESTS PASARON"
          echo "✅ Listo para merge/deploy"

      - name: ❌ Tests fallaron
        if: |
          needs.backend-tests.result == 'failure' || 
          needs.integration-tests.result == 'failure' || 
          needs.e2e-tests.result == 'failure'
        run: |
          echo "❌ TESTS FALLARON"
          echo "❌ Merge/commit BLOQUEADO"
          echo "🔧 Revisa los logs arriba para ver qué falló"
          exit 1