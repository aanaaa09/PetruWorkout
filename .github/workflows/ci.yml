# .github/workflows/ci.yml
name: CI/CD - Tests y Deploy

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  # ==========================================
  # JOB 1: Tests Backend
  # ==========================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Ejecutar tests unitarios
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          EMAIL_API: test_key
          CALENDLY_API_KEY: test_key
          CALENDLY_USER_URI: test_uri
          CALENDLY_EVENT_URL: test_url
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          SPOTIFY_REFRESH_TOKEN: test_token
          OPENAI_API_KEY: test_key
        run: |
          cd backend
          pytest tests/unit/ -v --cov=backend --cov-report=term-missing --cov-report=json --cov-report=html

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            backend/coverage.json
            backend/htmlcov/
          retention-days: 30

  # ==========================================
  # JOB 2: Tests de Integración
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Ejecutar tests de integración
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          EMAIL_API: test_key
          CALENDLY_API_KEY: test_key
          CALENDLY_USER_URI: test_uri
          CALENDLY_EVENT_URL: test_url
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          SPOTIFY_REFRESH_TOKEN: test_token
          OPENAI_API_KEY: test_key
        run: |
          cd backend
          pytest tests/integration/ -v

  # ==========================================
  # JOB 3: Tests E2E (Selenium)
  # ==========================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: integration-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install selenium pytest pytest-selenium webdriver-manager httpx
          cd frontend
          npm ci
          npm run build

      - name: Iniciar backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          EMAIL_API: test_key
          CALENDLY_API_KEY: test_key
          CALENDLY_USER_URI: test_uri
          CALENDLY_EVENT_URL: test_url
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          SPOTIFY_REFRESH_TOKEN: test_token
          OPENAI_API_KEY: test_key
        run: |
          python -m uvicorn backend.main:app --host 0.0.0.0 --port 5000 &
          sleep 10

      - name: Iniciar frontend
        run: |
          cd frontend
          npm run preview -- --host 0.0.0.0 --port 5173 &
          sleep 10

      - name: Ejecutar tests E2E
        env:
          CI: true
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          EMAIL_API: test_key
          CALENDLY_API_KEY: test_key
          CALENDLY_USER_URI: test_uri
          CALENDLY_EVENT_URL: test_url
          SPOTIFY_CLIENT_ID: test_id
          SPOTIFY_CLIENT_SECRET: test_secret
          SPOTIFY_REFRESH_TOKEN: test_token
          OPENAI_API_KEY: test_key
        run: |
          cd backend
          pytest tests/e2e/ -v

      - name: Guardar screenshots si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: backend/tests/e2e/screenshots/
          retention-days: 7

  # ==========================================
  # JOB 4: Informe Final
  # ==========================================
  informe-final:
    name: Informe Final
    runs-on: ubuntu-latest
    needs: [backend-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar informe
        run: |
          cat > generate_report.py << 'EOF'
          import json
          from datetime import datetime

          with open('coverage/coverage.json', 'r') as f:
              coverage_data = json.load(f)

          total_coverage = coverage_data['totals']['percent_covered']
          total_statements = coverage_data['totals']['num_statements']
          covered_statements = coverage_data['totals']['covered_lines']
          missing_statements = coverage_data['totals']['missing_lines']

          backend_status = "${{ needs.backend-tests.result }}"
          integration_status = "${{ needs.integration-tests.result }}"
          e2e_status = "${{ needs.e2e-tests.result }}"

          report = f"""
          ## Resumen de Tests

          | Tipo | Estado |
          |------|--------|
          | Tests Unitarios | {backend_status} |
          | Tests de Integración | {integration_status} |
          | Tests End-to-End | {e2e_status} |

          ## Cobertura de Código

          - Cobertura Total: {total_coverage:.2f}%
          - Líneas Totales: {total_statements}
          - Líneas Cubiertas: {covered_statements}
          - Líneas Sin Cubrir: {missing_statements}

          ## Conclusión

          """

          all_passed = all(s == "success" for s in [backend_status, integration_status, e2e_status])

          if all_passed:
              report += f"ESTADO: APROBADO\n\nTodos los tests pasaron. Cobertura: {total_coverage:.1f}%"
          else:
              failed = []
              if backend_status != "success":
                  failed.append("Unitarios")
              if integration_status != "success":
                  failed.append("Integración")
              if e2e_status != "success":
                  failed.append("E2E")
              report += f"ESTADO: FALLADO\n\nTests fallidos: {', '.join(failed)}\nMerge bloqueado."

          with open('informe.md', 'w') as f:
              f.write(report)

          print(report)
          EOF

          python generate_report.py

      - name: Publicar informe
        run: |
          cat informe.md >> $GITHUB_STEP_SUMMARY

      - name: Verificar estado final
        run: |
          BACKEND="${{ needs.backend-tests.result }}"
          INTEGRATION="${{ needs.integration-tests.result }}"
          E2E="${{ needs.e2e-tests.result }}"

          if [ "$BACKEND" = "success" ] && [ "$INTEGRATION" = "success" ] && [ "$E2E" = "success" ]; then
            echo "TODOS LOS TESTS PASARON"
            exit 0
          else
            echo "TESTS FALLARON - Merge bloqueado"
            exit 1
          fi