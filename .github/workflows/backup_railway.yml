name: Backup Mensual Railway

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backup-railway:
    name: Descargar backup desde Railway
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install psycopg2-binary

      - name: Descargar backup
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          echo "Iniciando backup desde Railway..."
          python backend/backup_railway.py

      - name: Mostrar estadísticas
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " RESUMEN DEL BACKUP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -lh backups/*.sql 2>/dev/null | tail -1 || echo "Sin archivos SQL"
          echo ""
          echo " Archivos de backup:"
          ls -1 backups/ 2>/dev/null || echo "Carpeta vacía"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Subir backup como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/*.sql
          retention-days: 90

      - name: Guardar log en el repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backups/backup-log.json

          if git diff --staged --quiet; then
            echo "ℹ Sin cambios en el log"
          else
            FECHA=$(date '+%Y-%m-%d')
            git commit -m "Actualizar log de backup - $FECHA"
            git push
            echo "Log actualizado"
          fi

      - name: Completado
        if: success()
        run: |
          echo "BACKUP COMPLETADO"
          echo "$(date '+%Y-%m-%d %H:%M:%S')"

      - name: Error
        if: failure()
        run: |
          echo "ERROR EN EL BACKUP"
          exit 1