name: Backup Mensual Railway

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  backup-railway:
    name: Descargar backup desde Railway
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install psycopg2-binary

      - name: Descargar backup
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          echo "Iniciando backup desde Railway..."
          python backend/backup_railway.py

      - name: Mostrar estadísticas
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " RESUMEN DEL BACKUP"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ls -lh backups/*.sql 2>/dev/null | tail -1 || echo "Sin archivos SQL"
          echo ""
          echo " Archivos de backup:"
          ls -1 backups/ 2>/dev/null || echo "Carpeta vacía"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Commit y push del backup
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backups/
          
          if git diff --staged --quiet; then
            echo "ℹ  No hay datos nuevos"
          else
            FECHA=$(date '+%Y-%m-%d')
            git commit -m "📦 Backup mensual - $FECHA"
            git push
            echo " Backup subido"
          fi

      - name: Completado
        if: success()
        run: |
          echo "BACKUP COMPLETADO"
          echo " $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Error
        if: failure()
        run: |
          echo "ERROR EN EL BACKUP"
          exit 1