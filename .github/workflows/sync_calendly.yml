name: 🔄 Sync Calendly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          pip install -r backend/requirements.txt

      - name: ☕ Despertar Railway Database
        run: |
          python -c "
          import psycopg2
          import time
          import os
          
          database_url = os.getenv('DATABASE_URL')
          
          print('🔌 Intentando despertar Railway...')
          
          for i in range(1, 4):
              try:
                  print(f'Intento {i}/3...')
                  conn = psycopg2.connect(database_url, connect_timeout=30)
                  cursor = conn.cursor()
                  cursor.execute('SELECT 1')
                  conn.close()
                  print(f'✅ Railway despierto en intento {i}')
                  break
              except Exception as e:
                  print(f'⚠️ Intento {i} falló: {str(e)[:80]}')
                  if i < 3:
                      espera = i * 10
                      print(f'⏳ Esperando {espera}s...')
                      time.sleep(espera)
          
          print('✅ Listo para sync')
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🔄 Ejecutar sync de Calendly
        run: |
          echo "🔄 Iniciando sincronización de Calendly..."
          echo "🔍 Verificando DATABASE_URL..."
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL no está configurado"
            exit 1
          fi
          echo "✅ DATABASE_URL configurado"
          python -m backend.sync_calendly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALENDLY_API_KEY: ${{ secrets.CALENDLY_API_KEY }}
          CALENDLY_USER_URI: ${{ secrets.CALENDLY_USER_URI }}
          CALENDLY_EVENT_URL: ${{ secrets.CALENDLY_EVENT_URL }}
          EMAIL_API: ${{ secrets.EMAIL_API }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: ✅ Sincronización completada
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏰ $(date -u)"
          echo "✅ Workflow completado"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"