name: 🔄 Sync Calendly

on:
  schedule:
    - cron: '0 4 * * *'  # 4:00 AM UTC = 5:00 AM España
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          pip install -r backend/requirements.txt

      # ✅ NUEVO: Despertar Railway ANTES del sync
      - name: ☕ Despertar Railway
        run: |
          echo "🔌 Despertando Railway..."
          
          # Hacer petición a tu API (cambia la URL por la tuya)
          curl -X GET https://petruworkout-production.up.railway.app/health \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors || echo "⚠️ Railway aún dormido"
          
          echo "⏳ Esperando 15s para que Railway despierte..."
          sleep 15
          
          # Segunda petición para asegurar
          curl -X GET https://petruworkout-production.up.railway.app/health \
            --max-time 30 || echo "⚠️ Railway lento"
          
          echo "✅ Railway debería estar despierto"

      - name: 🔄 Ejecutar sync de Calendly
        run: |
          echo "🔄 Iniciando sincronización de Calendly..."
          python -m backend.sync_calendly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CALENDLY_API_KEY: ${{ secrets.CALENDLY_API_KEY }}
          CALENDLY_USER_URI: ${{ secrets.CALENDLY_USER_URI }}
          CALENDLY_EVENT_URL: ${{ secrets.CALENDLY_EVENT_URL }}
          EMAIL_API: ${{ secrets.EMAIL_API }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: ✅ Sincronización completada
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏰ $(date -u)"
          echo "✅ Workflow completado"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"