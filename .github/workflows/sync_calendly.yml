name: Sincronizar Calendly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-calendly:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 📅 Sincronizar Calendly
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          CALENDLY_API_KEY: ${{ secrets.CALENDLY_API_KEY }}
          CALENDLY_USER_URI: ${{ secrets.CALENDLY_USER_URI }}
        run: |
          echo "🔄 Iniciando sincronización de Calendly..."
          python -m backend.sync_calendly
          echo "✅ Sincronización completada"

      - name: 📊 Resumen
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏰ $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "✅ Workflow completado"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 🚨 Error
        if: failure()
        run: |
          echo "❌ ERROR - Revisa los logs arriba"